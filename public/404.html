<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SRGBASE</title>
    <script>
      // GitHub Pages serves static files only, so a deep link such as
      // /SRGBASE/diff-expression/miRNA has no file on disk and lands here.
      // Encode the requested path into a query string and bounce to index.html,
      // which restores the real URL before React Router mounts.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      //
      // pathSegmentsToKeep = number of leading path segments that belong to the
      // site root rather than the app route. 1 for a project page (/SRGBASE/),
      // 0 for a user page or custom domain.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
